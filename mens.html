    function toggleDropdown(id) {
      const dropdowns = ['apparel', 'fragrance', 'jewelry', 'accessory'];
      dropdowns.forEach(d => {

        if (d === id) {
          element.classList.toggle('hidden');
        } else {
          element.classList.add('hidden');
        }
      });
    }

    <!-- JS -->
    <script>
      function toggleDetails(id) {
        const details = document.getElementById(id);
        details.style.display = details.style.display === "block" ? "none" : "block";
      }
  
      function toggleSizeDropdown(id) {
        const dropdown = document.getElementById(id);
        dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
      }
  
      function selectSize(buttonId, size) {
        const button = document.getElementById(buttonId);
        button.innerHTML = size;
        const dropdown = document.getElementById(buttonId.replace("Btn", "Dropdown"));
        dropdown.style.display = "none";
      }
  
      function addToCart(button) {
        button.style.backgroundColor = "#474747";
        button.innerHTML = "Added";
        button.disabled = true;  // Optional: Disable the button after adding
      }
    </script>
